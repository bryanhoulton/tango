# Test suite for every PR (and main).
#
# Mirrors the local flow: build package dists (templates and package tests
# resolve @tango-ts/* through dist types), typecheck, run the no-DB unit +
# type-level suite, the built-package tests, and the integration suite against
# a REAL MySQL — integration tests never skip when the DB is missing (project
# policy), so the service container is not optional.
#
# Lint and the serverless bundle guards run in import-graph.yaml.
name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tango
          MYSQL_DATABASE: tango_test
        ports:
          # Host 3307 -> container 3306, matching docker-compose.yml and the
          # integration test defaults.
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptango"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30

    env:
      TANGO_DB_HOST: 127.0.0.1
      TANGO_DB_PORT: 3307
      TANGO_DB_USER: root
      TANGO_DB_PASSWORD: tango
      TANGO_DB_NAME: tango_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: yarn install --frozen-lockfile

      # Build first: typecheck covers the CLI templates, which resolve
      # @tango-ts/* through each package's dist types.
      - name: Build packages
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Unit + type-level tests
        run: yarn vitest run

      - name: Built-package tests
        run: yarn vitest run --config vitest.package.config.ts

      - name: Integration tests (real MySQL)
        run: yarn vitest run --config vitest.integration.config.ts
